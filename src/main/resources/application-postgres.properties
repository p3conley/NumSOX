# Activate with the postgres profile, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# On Railway, set the SPRING_PROFILES_ACTIVE=postgres environment variable on the app
# service instead -- Railway's Postgres plugin injects PGHOST/PGPORT/PGDATABASE/PGUSER/
# PGPASSWORD automatically once the two services are linked, so no other config is needed.

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:redsox_tracker}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:CHANGE_ME_TO_YOUR_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
# Never run data.sql -- seeding is handled by StartupSyncService, same as the H2 profile.
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
