spring.application.name=numsox
server.port=${PORT:8080}

# File-based H2 so fetched data survives restarts
spring.datasource.url=jdbc:h2:file:./data/redsox-tracker;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
# Never run data.sql automatically - seeding is handled by StartupSyncService
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# The standings timelapse ships a whole season in one response, which compresses well.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=2048

# Logging for MLB API calls
logging.level.com.example.redsoxtracker=INFO
