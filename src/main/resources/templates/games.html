<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Games - NumSOX</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: topbar('games')}"></nav>

<div class="page-content">

  <div class="panel">
    <div class="panel-title">Filter Games</div>
    <form class="filters" th:action="@{/games}" method="get">
      <label>Opponent
        <input type="text" name="opponent" placeholder="Yankees" th:value="${opponent}"/>
      </label>
      <label>Result
        <select name="result">
          <option value="">All</option>
          <option value="W" th:selected="${result == 'W'}">Wins</option>
          <option value="L" th:selected="${result == 'L'}">Losses</option>
        </select>
      </label>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <button type="submit">Apply</button>
        <a class="button secondary" th:href="@{/games}">Clear</a>
      </div>
    </form>
  </div>

  <div class="panel">
    <div class="panel-title" th:text="${#lists.size(games)} + ' Games'">10 Games</div>
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Opponent</th><th>H/A</th><th>Venue</th><th>Score</th><th>Result</th><th>Status</th><th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="game : ${games}"
            th:classappend="${game.result == 'W' ? 'row-win' : (game.result == 'L' ? 'row-loss' : '')}">
          <td th:text="${#temporals.format(game.gameDate, 'MMM d')}">Apr 3</td>
          <td>
            <a class="team-link" th:href="@{/games/{id}(id=${game.id})}">
              <img class="table-team-logo" th:src="${@teamLogoService.logoForName(game.opponent)}" th:alt="${game.opponent + ' logo'}"/>
              <span th:text="${game.opponent}">Yankees</span>
            </a>
          </td>
          <td th:text="${game.homeAway}">Home</td>
          <td th:text="${game.venue ?: 'N/A'}">Fenway Park</td>
          <td th:text="${game.redSoxScore != null ? game.redSoxScore + '-' + game.opponentScore
                          : (game.startTime == null or game.startTimeTbd == true ? 'Time TBD' : #temporals.format(game.startTime, 'h:mm a'))}">5-3</td>
          <td>
            <span th:if="${game.result != null}"
                  th:text="${game.result}"
                  th:class="${game.result == 'W' ? 'badge badge-win' : 'badge badge-loss'}">W</span>
            <span th:if="${game.result == null}" class="badge badge-scheduled">SCH</span>
          </td>
          <td th:text="${game.status}">Final</td>
          <td th:text="${#lists.size(game.notes)}">0</td>
        </tr>
      </tbody>
    </table>
    </div>
  </div>

</div>
</body>
</html>
